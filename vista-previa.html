@media(max-width:690px){.layout{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:5px;padding:8px}nav button{min-width:130px;text-align:center}header{padding:16px}}</style></head><body><header><h1>Evaluación técnica · Asesor de Métricas · MVM</h1><p>MVM · Empresa que produce, distribuye y vende libros</p></header><main><div id="pilotTop" class="notice" style="margin-top:12px;background:#edf7f1;border-color:#b9d8c1" aria-live="polite">Preparando evaluación…</div><div class="layout"><nav id="nav"></nav><section class="panel"><div id="body"></div><div class="bar"><div id="progress"></div></div><div class="actions" id="stageFoot"><button class="btn" onclick="move(1)">Continuar a preguntas objetivas →</button></div></section></div></main><script>const names=['Bienvenida','Identificación','Preguntas objetivas','Excel · fórmulas','Excel · tablas dinámicas','SQL','Python','Casos abiertos','Finalización'];const stages=[`<h2>Evaluación técnica · Asesor de Métricas</h2><p>Lee las instrucciones y acepta las reglas de integridad. Después pulsa <strong>Comenzar evaluación</strong> al final de esta página. El reloj de 75 minutos empezará en ese momento y pasarás automáticamente a Identificación.</p><button class="btn" id="beginPilot" type="button" disabled style="display:block;width:100%;padding:15px 20px;font-size:18px;font-weight:700;margin-top:16px">Comenzar evaluación · 75 minutos</button>`,`<h2>Identificación del aspirante</h2><p class="muted">Escribe tus datos de identificación tal como deseas que aparezcan en tu evaluación.</p><div class="question"><label>Nombre completo</label><input type="text" placeholder="Nombre y apellido"></div><div class="question"><label>Correo electrónico</label><input type="email" placeholder="correo@ejemplo.com"></div>`,`<h2>15 preguntas de conocimiento</h2><p>Responde las 15 preguntas de forma individual, seleccionando la opción que consideres correcta. Puedes cambiar tus respuestas antes de avanzar; las soluciones y la calificación no se mostrarán durante el examen.</p>`,`<h2>Excel · Fórmulas y análisis (práctica 1)</h2><p>Trabaja con <strong>240 registros de pedidos de libros de MVM</strong>. Calcula los pedidos creados (J3), cancelados (J4), la tasa de cancelación (J5) y la <strong>diferencia de pedidos completados entre el canal con más y el canal con menos</strong> (J7). <strong>Todas las respuestas finales deben contener fórmulas basadas en los datos, nunca resultados escritos manualmente.</strong> Puedes utilizar las columnas H y K como auxiliares y combinar diferentes funciones; cualquier procedimiento correcto es válido.</p><p>Al terminar, pulsa <strong>Terminar práctica de Excel</strong> dentro de la hoja; regresarás automáticamente a esta evaluación y continuarás con las tablas dinámicas. <strong>Terminar Excel no finaliza toda la evaluación.</strong></p><div class="question" style="padding:8px"><iframe referrerpolicy="no-referrer" id="excelPreviewFrame" title="Práctica de Excel de MVM" src="./index.html?embed=1&amp;v=33" style="display:block;width:100%;height:min(90vh,1100px);min-height:680px;border:1px solid #b7cce0;border-radius:8px;background:white" loading="lazy"></iframe></div><p class="muted">Completa el ejercicio en esta pantalla y pulsa <strong>Terminar práctica de Excel</strong> para guardar tus resultados.</p>`, `<h2>Excel avanzado · Tablas dinámicas (práctica 2)</h2><p>Recibirás <strong>tres solicitudes de análisis empresarial</strong>, una a la vez. Debes decidir qué campos, agregaciones, filtros y ordenamientos son apropiados, sin instrucciones sobre cómo configurarlos. Tras construir cada informe, introduce las conclusiones y pulsa <strong>Guardar y continuar</strong>. Al completar el tercer ejercicio avanzarás automáticamente a SQL.</p><div class="question" style="padding:8px"><iframe referrerpolicy="no-referrer" id="pivotPreviewFrame" title="Tabla dinámica MVM" src="./excel-pivot.html?embed=1&amp;v=34" style="display:block;width:100%;height:min(90vh,1100px);min-height:650px;border:1px solid #b7cce0;border-radius:8px;background:white" loading="lazy"></iframe></div><p class="muted">En PC la práctica ocupa todo el ancho disponible. <strong>Guarda cada uno de los tres ejercicios y finaliza desde aquí</strong> para incluir sus configuraciones en el informe del intento. Al terminar, continúa a la siguiente actividad.</p>`,`<h2>SQL · Ejercicio práctico</h2><p>En MVM, escribe y ejecuta una consulta SQL que relacione ventas y títulos de libros, agrupe por categoría, sume unidades e ingresos, y ordene por el importe total de mayor a menor.</p><p>Cuando termines, pulsa <strong>«Terminar SQL y continuar a Python»</strong> dentro del editor. El código y el último resultado quedarán registrados al terminar la actividad.</p><div class="question" style="padding:8px"><iframe referrerpolicy="no-referrer" id="sqlPreviewFrame" title="Laboratorio SQL MVM" src="./sql.html?embed=1&amp;v=34" style="display:block;width:100%;height:min(90vh,1100px);min-height:680px;border:1px solid #b7cce0;border-radius:8px;background:white" loading="lazy"></iframe></div><p class="muted">El editor utiliza SQLite. Guarda tu consulta al finalizar el ejercicio.</p>`,`<h2>Python y pandas · Ejercicio práctico</h2><p>Lee el CSV de ventas de libros de MVM; calcula el importe por línea, agrupa por categoría y muestra el total de unidades e importes, ordenado de mayor a menor por importe.</p><p>Ejecuta el código y pulsa <strong>«Terminar Python y continuar»</strong> para registrar tu solución antes de responder los casos abiertos.</p><div class="question" style="padding:8px"><iframe referrerpolicy="no-referrer" id="pythonPreviewFrame" title="Laboratorio Python de MVM" src="./python.html?embed=1&amp;v=34" style="display:block;width:100%;height:min(90vh,1100px);min-height:690px;border:1px solid #b7cce0;border-radius:8px;background:white" loading="lazy"></iframe></div><p class="muted">Python y pandas se ejecutan localmente mediante Pyodide; la primera carga puede requerir una descarga importante.</p>`,`<h2>Casos de análisis</h2><p>Los tres casos abiertos aparecerán <strong>al final</strong> de la evaluación, uno a uno. En la prueba definitiva, cada envío requerirá confirmación y no permitirá volver atrás.</p><div class="question"><strong>Ejemplo de formato de respuesta</strong><p>Explica cómo evaluarías una mejora operativa en MVM, empresa que produce, distribuye y vende libros, distinguiendo resultados observados de efectos atribuibles a la intervención.</p><textarea placeholder="Escribe aquí tu razonamiento..."></textarea></div><p class="muted">El texto se guarda localmente mientras continúas la evaluación y aparecerá en el archivo de entrega.</p>`,`<h2>Evaluación finalizada</h2><p>La versión definitiva mostrará una confirmación de recepción al aspirante, sin revelar soluciones ni resultados privados.</p><p>Posteriormente se realizará la revisión de casos abiertos, la consolidación de resultados y el ranking privado de candidatos.</p><p class="muted">Utiliza el botón «Finalizar prueba y descargar informe» para conservar tu entrega. Los resultados y el ranking se revisarán posteriormente.</p>`];
const knowledgeData=[["MVM produce, distribuye y vende libros. En su canal de venta directa se registraron 500 pedidos de libros y se entregaron 425; los demás se cancelaron. ¿Qué porcentaje de los pedidos creados se canceló?",["12 %","15 %","17.6 %","20 %"]],["MVM necesita completar 900 pedidos de libros de su canal de distribución y estima que se cancelará el 25 % de los pedidos creados. ¿Cuántos pedidos debe crear como mínimo?",["1,125","1,250","1,200","1,180"]],["En la tienda en línea de libros de MVM, la campaña A convierte el 15 % de 200 visitas y la campaña B el 12 % de 1,000 visitas. ¿Qué interpretación cuantitativa es correcta?",["A aporta 30 conversiones y B aporta 100","La tasa combinada es 13.5 %","A logra más conversiones absolutas por su mayor tasa","B logra 120 conversiones y A logra 30, aunque B tenga una menor tasa"]],["Después de promocionar una colección de libros, las ventas de MVM crecieron 10 %. ¿Qué enfoque proporciona la evidencia más sólida de que la campaña causó parte del incremento?",["Comparar la evolución antes/después de tiendas tratadas y controles comparables, examinando tendencias y factores externos","Comparar contra el mismo mes del año anterior ajustando por estacionalidad, sin grupo de contraste","Extrapolar la tendencia previa de las tiendas promocionadas y atribuir la diferencia completa a la campaña","Medir la correlación entre inversión publicitaria y ventas durante el periodo de promoción"]],["En las ventas de libros de MVM, solo el 4 % de las compras termina en devolución. Para un clasificador de devoluciones de ejemplares, ¿qué conjunto de métricas es más informativo que accuracy por sí sola?",["Accuracy desglosada únicamente por sucursal","ROC-AUC global, sin estudiar los aciertos de la clase minoritaria","Precisión, recall y PR-AUC para la clase de devoluciones","MAE del importe de las compras, sin evaluar las devoluciones"]],["MVM planifica la impresión y distribución de libros según un pronóstico semanal de ventas con estacionalidad. ¿Qué validación permite evaluar el pronóstico de manera más apropiada?",["K-Fold aleatorio estratificado por mes","Validación temporal de ventanas móviles o crecientes con pruebas en períodos posteriores","Separar tiendas al azar y mezclar fechas para equilibrar la muestra","Una sola partición aleatoria de datos históricos con corrección estacional"]],["MVM desea predecir, al momento de comprar un libro, si el ejemplar será devuelto. ¿Cuál variable introduce fuga de información (data leakage)?",["Tasa histórica de devoluciones del producto calculada solo con compras anteriores","Categoría y precio registrados al crear la compra","Tienda, canal y fecha conocidos en ese momento","Estado final de devolución del mismo pedido, registrado días después"]],["En el registro de compras de libros de MVM, cada fila tiene devuelta=1 o 0. ¿Qué expresión SQL calcula la tasa de devoluciones evitando explícitamente la división entre cero?",["SUM(CASE WHEN devuelta=1 THEN 1 ELSE 0 END)*1.0/NULLIF(COUNT(*),0)","SUM(CASE WHEN devuelta=1 THEN 1 ELSE 0 END)*1.0/COUNT(*)","COUNT(*)*1.0/NULLIF(SUM(devuelta),0)","SUM(devuelta)*1.0/NULLIF(COUNT(DISTINCT producto_id),0)"]],["El DataFrame de ventas de libros de MVM contiene categoria y ventas (importe). ¿Qué instrucción de pandas calcula las ventas totales por categoría editorial?",["df.groupby(\"categoria\")[\"ventas\"].count()","df.groupby(\"categoria\")[\"ventas\"].mean()","df.groupby(\"categoria\")[\"ventas\"].sum()","df.pivot_table(index=\"categoria\", values=\"ventas\", aggfunc=\"count\")"]],["En Power BI, MVM analiza la conversión de visitas a compras de libros por sucursal y mes. ¿Qué enfoque calcula correctamente la tasa al cambiar los filtros, aunque existan volúmenes distintos?",["Promediar sin ponderar la tasa calculada en cada fila de origen","Usar una medida DAX que aplique DIVIDE a las medidas agregadas de conversiones y visitas","Sumar las tasas mensuales de las tiendas incluidas en el filtro","Crear una columna con la tasa anual fija de la empresa y mostrarla en todos los contextos"]],["MVM, empresa que produce, distribuye y vende libros, evalúa dónde abrir su próximo punto de venta. ¿Cuál metodología de priorización ofrece mayor solidez?",["Ordenar barrios por crecimiento reciente de ventas, dando más peso al último trimestre","Priorizar las zonas con mayores ventas actuales por metro cuadrado comercial","Elegir zonas según capacidad de gasto estimada y tamaño de población, sin costos","Combinar demanda alcanzable, competencia, capacidad operativa, inversión, margen esperado y validación de supuestos"]],["La conversión de visitas a compras de libros en la tienda en línea de MVM cae bruscamente. ¿Cuál es el primer paso analítico más sólido?",["Comprobar integridad del seguimiento, denominadores, cambios de mezcla de tráfico, volumen y estacionalidad","Comparar de inmediato con tiendas semejantes antes de revisar la instrumentación del sitio","Reentrenar el modelo de pronóstico utilizando la cifra reciente como dato confirmado","Modificar descuentos para intentar recuperar conversiones antes de verificar los datos"]],["MVM registra Fecha, Sucursal, Pedidos de libros y Entregas en una Tabla de Excel. ¿Cómo calcular la tasa mensual de entrega por sucursal de forma actualizable al agregar nuevas filas?",["Promediar las tasas diarias de todas las filas, aunque los volúmenes difieran","Crear sumas sobre un rango fijo y actualizar manualmente las referencias cada semana","Usar una tabla dinámica sobre una Tabla de Excel actualizable y dividir entregas agregadas entre pedidos agregados","Presentar solo las entregas mensuales en un gráfico dinámico sin usar los pedidos"]],["MVM tiene tablas de clientes y compras de libros. Algunos clientes nunca han comprado. Se necesita presentar todos los clientes y su importe acumulado en libros, con cero para quienes no tienen compras. ¿Qué enfoque SQL corresponde?",["Usar INNER JOIN, GROUP BY cliente y COALESCE sobre el importe","Usar LEFT JOIN desde clientes, agrupar por cliente y COALESCE(SUM(importe),0)","Usar LEFT JOIN y filtrar en WHERE a las compras con importe mayor o igual a cero","Usar LEFT JOIN y SUM(importe) sin tratar valores NULL en clientes sin compras"]],["Un DataFrame de MVM contiene sucursal, visitas y compras de libros por día. ¿Cómo calcular correctamente la conversión total por sucursal cuando los días tienen distintos volúmenes?",["Promediar sin ponderar las tasas diarias por sucursal","Sumar compras por sucursal y dividir entre el número de días observados","Dividir las compras totales por sucursal entre las visitas máximas de un solo día","Agrupar por sucursal, sumar compras y visitas por separado y dividir ambos totales"]]];
const caseData=[["Caso 1: impacto de una campaña editorial","MVM produce, distribuye y vende libros. Después de promocionar una colección en dos sucursales, aumentaron las ventas, pero el mercado editorial también creció. Explica cómo estimarías el efecto incremental de la campaña, qué datos necesitarías, qué supuestos validarías y qué riesgos habría."],["Caso 2: pronóstico de impresión y ventas","MVM necesita pronosticar las ventas mensuales de libros por sucursal y categoría editorial para planificar impresión, inventario y distribución. Describe los datos necesarios, el método de pronóstico, validación temporal, métricas de error e incertidumbre que comunicarías a la dirección."],["Caso 3: priorización de títulos","MVM cuenta con 60 títulos de libros con potencial de promoción, pero presupuesto para impulsar 12. Explica cómo elegirías los 12 títulos, considerando demanda, márgenes, inventario, capacidad de impresión, distribución y costos, y cómo evaluarías si la selección generó valor incremental."]];
let knowledgeIndex=0,caseIndex=0;
const knowledgeAnswers=Array(15).fill(-1),caseAnswers=["","",""];
function safeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function knowledgeView(){
const item=knowledgeData[knowledgeIndex],done=knowledgeAnswers.filter(x=>x>=0).length;
let t='<h2>Pregunta '+(knowledgeIndex+1)+' de 15'+(knowledgeIndex>=13?' · Nueva':'')+'</h2><p class="muted">'+done+' de 15 respondidas. Selecciona una opción y navega con los botones inferiores. No se muestran respuestas correctas.</p><div class="question"><strong>'+safeHtml(item[0])+'</strong>';
for(let i=0;i<item[1].length;i++)t+='<label><input type="radio" name="knowAnswer" value="'+i+'" '+(knowledgeAnswers[knowledgeIndex]===i?'checked':'')+'>'+String.fromCharCode(65+i)+'. '+safeHtml(item[1][i])+'</label>';
return t+'</div><div class="actions"><button class="btn secondary" onclick="questionMove(-1)" '+(knowledgeIndex===0?'disabled':'')+'>← Pregunta anterior</button><button class="btn" onclick="questionMove(1)">'+(knowledgeIndex===14?'Continuar a Excel →':'Siguiente pregunta →')+'</button><button class="btn secondary" onclick="questionJump(13)">Ir a pregunta 14 · SQL</button><button class="btn secondary" onclick="questionJump(14)">Ir a pregunta 15 · Python</button></div>';
}
function caseView(){const c=caseData[caseIndex];return '<h2>Casos abiertos · '+(caseIndex+1)+' de 3</h2><p class="muted">Redacta tu respuesta con tus propios conocimientos. Al confirmar, el caso queda cerrado y no podrás regresar.</p><div class="question"><strong>'+safeHtml(c[0])+'</strong><p>'+safeHtml(c[1])+'</p><textarea id="caseResponse" placeholder="Escribe tu razonamiento...">'+safeHtml(caseAnswers[caseIndex])+'</textarea></div><div class="actions"><button class="btn" onclick="caseMove(1)">'+(caseIndex===2?'Cerrar caso y continuar a revisión →':'Cerrar caso y continuar →')+'</button></div>';}
function excelFormulaReview(){
 if(!excelPilotReport)return "";
 const rows=Object.entries(excelPilotReport.answers||{}).map(([cell,answer])=>
  '<tr><td><strong>'+safeHtml(cell)+'</strong></td><td><code>'+safeHtml(answer.input||"")+'</code></td><td>'+safeHtml(answer.evaluated||"")+'</td></tr>').join("");
 const auxiliaries=(excelPilotReport.helperFormulas||[]).map(row=>
  '<tr><td><strong>'+safeHtml(row.cell)+'</strong></td><td><code>'+safeHtml(row.input)+'</code></td></tr>').join("");
 return '<details class="question"><summary><strong>Revisar método utilizado en Excel</strong> · fórmulas finales y '+(excelPilotReport.helperFormulas||[]).length+' fórmulas auxiliares</summary><p class="muted">Revisión local del método, no resultado oficial.</p>'+
 '<table style="width:100%;border-collapse:collapse"><thead><tr><th>Respuesta</th><th>Fórmula</th><th>Valor</th></tr></thead><tbody>'+rows+'</tbody></table>'+
 (auxiliaries?'<h3>Fórmulas auxiliares</h3><table style="width:100%"><tbody>'+auxiliaries+'</tbody></table>':'<p class="muted">No se usaron auxiliares en las columnas H o K.</p>')+'</details>';
}
function pilotReview(){return '<h2>Revisión del recorrido piloto</h2><p>Preguntas de conocimiento contestadas: <strong>'+knowledgeAnswers.filter(x=>x>=0).length+' / 15</strong>.</p><p>Casos abiertos con texto: <strong>'+caseAnswers.filter(x=>x.trim()).length+' / 3</strong>.</p><p>Práctica de Excel (fórmulas): <strong>'+ (excelPilotReport?('terminada; puntuación diagnóstica local '+excelPilotReport.score+'/100'):'sin finalizar')+'</strong>. Tabla dinámica: <strong>'+(pivotPilotReport?'recorrida':'pendiente')+'</strong>. Las pruebas de SQL y Python todavía no tienen calificación conectada.</p>'+excelFormulaReview()+'<p class="muted">No se ha enviado ningún examen. Próxima etapa: validar los ejercicios, diseñar cierre de evaluación, revisión privada de resultados y ranking.</p>';}
function pilotHandlers(){
if(at===2)document.querySelectorAll('input[name="knowAnswer"]').forEach(el=>el.addEventListener("change",ev=>{knowledgeAnswers[knowledgeIndex]=Number(ev.target.value);render();}));
if(at===7){const e=document.getElementById('caseResponse');if(e)e.addEventListener("input",ev=>{caseAnswers[caseIndex]=ev.target.value;});}}
function questionMove(n){if(n>0&&knowledgeIndex===14){go(3);return;}knowledgeIndex=Math.max(0,Math.min(14,knowledgeIndex+n));render();}
function questionJump(n){knowledgeIndex=n;render();}
function caseMove(n){if(n>0&&caseIndex===2){go(8);return;}caseIndex=Math.max(0,Math.min(2,caseIndex+n));render();}
let excelPilotReport=null,pivotPilotReport=null;
let at=new URLSearchParams(location.search).has("tester")?0:Math.max(0,Math.min(names.length-1,Number(new URLSearchParams(location.search).get("etapa")||0)||0));
function updateCurrentStageUrl(){
 try{const u=new URL(window.location.href);u.searchParams.set("etapa",String(at));window.history.replaceState(window.history.state,"",u.toString());}
