<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Comprobación del receptor V36</title><style>body{font:16px system-ui;margin:32px auto;max-width:600px;padding:0 16px;color:#17233b}button{background:#123b80;color:#fff;border:0;padding:12px 20px;border-radius:8px;font:inherit}pre{background:#eef4fc;padding:16px;white-space:pre-wrap}</style><h1>Comprobación del receptor V36</h1><p>Esta comprobación no usa ninguna invitación real ni crea una sesión.</p><button id="test">Verificar conexión</button><pre id="result" aria-live="polite">Pendiente de comprobación.</pre><script src="./sandbox-config.js"></script><script>
document.getElementById("test").onclick=()=>{
 const result=document.getElementById("result"),b=document.getElementById("test");b.disabled=true;result.textContent="Comprobando…";const nonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),v=>v.toString(16).padStart(2,"0")).join("");
 const frame=document.createElement("iframe"),form=document.createElement("form");frame.name="mvm36diagnostic_"+nonce;frame.hidden=true;form.hidden=true;form.method="POST";form.action=window.MVM36_CONFIG.endpoint;form.target=frame.name;
 const fields={action:"v36_claim",invitationCode:"DIAGNOSTICO",invitationToken:"0".repeat(64),browser:"0".repeat(48),tab:"0".repeat(48),nonce,payload:"{}"};for(const [k,v] of Object.entries(fields)){const x=document.createElement("input");x.name=k;x.value=v;form.append(x);}
 function stop(message){clearTimeout(timer);window.removeEventListener("message",listen);form.remove();frame.remove();result.textContent=message;b.disabled=false;}
 function listen(e){const d=e.data;if(!/^https:\/\/(?:script\.google\.com|script\.googleusercontent\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(e.origin)||d?.nonce!==nonce)return;if(d.type==="MVM36_SESSION_RECEIPT"&&d.version===36&&d.ok===false&&["SANDBOX_DISABLED","INVALID_INVITATION"].includes(d.status))stop("RECEPTOR V36 CONECTADO\n"+(d.status==="SANDBOX_DISABLED"?"Pilotos aún desactivados.":"Pilotos activados; invitación ficticia rechazada."));else stop("Respuesta inesperada. No continuar con la activación.");}
 window.addEventListener("message",listen);const timer=setTimeout(()=>stop("No se recibió confirmación. No continuar con la activación."),45000);document.body.append(frame,form);form.submit();
};
</script></html>
